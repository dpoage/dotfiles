# Kitty Configuration

# Include gruvbox dark color scheme (OLED optimized)
include gruvbox-dark.conf

# Font settings
font_family JetBrains Mono
font_size 12.0

# Window settings
remember_window_size  yes
initial_window_width  640
initial_window_height 400

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0

# Mouse
mouse_hide_wait 3.0
url_color #83a598
url_style curly

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Misc
update_check_interval 0